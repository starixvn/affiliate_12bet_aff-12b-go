# SonarQube Configuration for Fanex.Affiliate.Link Solution

# Project identification
sonar.projectKey=Fanex.Affiliate.Link
sonar.projectName=Fanex.Affiliate.Link
sonar.projectVersion=1.0

# Source code paths
sonar.sources=Fanex.Affiliate.Link,Fanex.Affiliate.Link.Core,Fanex.Affiliate.Link.Consumer
sonar.tests=UnitTests

# Coverage exclusions - Files to exclude from coverage calculation
sonar.coverage.exclusions=\
**/Fanex.Affiliate.Link/Program.cs,\
**/Fanex.Affiliate.Link.Consumer/Program.cs,\
**/Fanex.Affiliate.Link/Services/HealthCheck/**/*.cs,\
**/Fanex.Affiliate.Link/Models/HealthCheck/**/*.cs,\
**/Fanex.Affiliate.Link/App_Start/**/*.cs,\
**/Fanex.Affiliate.Link/Controllers/HealthController.cs,\
**/Fanex.Affiliate.Link/Views/**/*.cshtml,\
**/Fanex.Affiliate.Link/Workers/**/*.cs,\
**/Fanex.Affiliate.Link.Consumer/ClickTrackingWorker.cs,\
**/Fanex.Affiliate.Link.Consumer/ClickTrackingDLQWorker.cs,\
**/Fanex.Affiliate.Link.Consumer/ClickTrackingRedisStorageWorker.cs,\
**/Fanex.Affiliate.Link/Properties/**/*.cs,\
**/Fanex.Affiliate.Link.Consumer/Properties/**/*.cs,\
**/Fanex.Affiliate.Link.Core/Properties/**/*.cs,\
**/UnitTests/**/*.cs,\
**/*.Tests.cs,\
**/*Test.cs,\
**/*Tests.cs

# Test coverage exclusions
sonar.test.coverage.exclusions=\
**/UnitTests/**/*.cs,\
**/*.Tests.cs,\
**/*Test.cs,\
**/*Tests.cs

# Duplicate code exclusions
sonar.cpd.exclusions=\
**/UnitTests/**/*.cs,\
**/*.Tests.cs,\
**/*Test.cs,\
**/*Tests.cs

# Language
sonar.language=cs

# Encoding
sonar.sourceEncoding=UTF-8

# Additional exclusions for analysis
sonar.exclusions=\
**/bin/**/*,\
**/obj/**/*,\
**/publish/**/*,\
**/coverage/**/*,\
**/.vs/**/*,\
**/.sonarqube/**/*,\
**/node_modules/**/*,\
**/packages/**/*,\
**/*.min.js,\
**/*.min.css,\
**/appsettings.*.json,\
**/nlog.config,\
**/Dockerfile,\
**/README.md,\
**/ARCHITECTURE.md,\
**/*.xml,\
**/*.txt,\
**/*.md
